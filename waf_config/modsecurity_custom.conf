# File: waf_config/modsecurity_custom.conf

# Nạp các file cấu hình lõi của Hệ thống OWASP CRS
Include /etc/modsecurity.d/modsecurity.conf
Include /etc/modsecurity.d/owasp-crs.conf

# 🛑 BẬT CHẾ ĐỘ CHẶN ĐỨNG (Không khoan nhượng)
# Nếu phát hiện SQLi/XSS, WAF sẽ lập tức ngắt kết nối và trả về mã lỗi 403 Forbidden.
SecRuleEngine On

# Cấu hình lưu Log chi tiết để phục vụ Giám sát SOC
SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLog /var/log/modsec_audit.log

# 🎯 NÂNG CẤP DOANH NGHIỆP: Tăng cấp độ Hoang tưởng (Paranoia Level) lên mức 2
# Mức này sẽ thắt chặt an ninh, phát hiện các kỹ thuật Obfuscation (Làm rối mã) của Hacker.
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=2"