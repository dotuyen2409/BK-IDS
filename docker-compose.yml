# /home/ids/bk_ids/docker-compose.yml
# ========================================================================
# BK-IDS SOC: LEAN NGIPS COMPOSE — Phase 1 Rebuild
# Architecture: Snort 3 NGIPS + Flask SOAR + MySQL + Redis + Vue/Nginx
# Target: < 2 GB RAM total runtime footprint
# Note: anomaly_sensor has been brought back to fulfill Dual-Engine NGIPS requirement.
# Removed: Kafka, Zookeeper, Elasticsearch, Logstash, Kibana, ModSecurity WAF, misuse_ips
# ========================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =====================================================================
  # 1. MYSQL DATABASE — System of Record
  # =====================================================================
  mysql_db:
    image: mysql:8.0
    container_name: bkids_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Bind to localhost only — not exposed to external network
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d:ro
    networks:
      - bkids_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  # =====================================================================
  # 2. REDIS CACHE — Rate limit, cooldown, dedup ephemeral state
  # NOT used as event bus or durable queue
  # =====================================================================
  redis_cache:
    image: redis:7-alpine
    container_name: bkids_redis
    restart: unless-stopped
    # Bind to localhost only
    ports:
      - "127.0.0.1:6379:6379"
    command: /bin/sh -c 'redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - bkids_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  # =====================================================================
  # 3. FLASK API SERVER — Control Plane, SOAR Orchestrator & LogWatchdog
  # Runs background LogWatchdog that tails /var/log/snort/alert_json.txt
  # Writes alerts directly to MySQL — no Kafka/Logstash dependency
  # =====================================================================
  api_server:
    build:
      context: .
      dockerfile: Dockerfile.api
      network: host
    container_name: bkids_api
    restart: unless-stopped
    env_file: .env
    pid: "host"
    userns_mode: host
    ports:
      - "5050:5000"
    networks:
      - bkids_network
    volumes:
      - ./:/app
      - ./storage:/app/storage
      # Shared snort log volume — LogWatchdog reads alert_json.txt from here
      - snort_logs:/var/log/snort:ro
    working_dir: /app/web_dashboard/backend_api
    command: /bin/sh -c "pip install pymysql redis flask-socketio --break-system-packages 2>/dev/null || pip install pymysql redis flask-socketio; python3 api_server.py"
    logging: *default-logging
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # =====================================================================
  # 4. VUE.JS FRONTEND DASHBOARD — Served via Nginx static
  # Reads alerts/blocks from Flask API only — no Kibana/ES dependency
  # =====================================================================
  frontend_ui:
    image: nginx:alpine
    container_name: bkids_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web_dashboard/frontend:/usr/share/nginx/html:rw
      - ./web_dashboard/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bkids_network
    logging: *default-logging
    depends_on:
      - api_server
    # read_only: true  # Disabled: frontend needs RW for hot-update
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  # =====================================================================
  # 5. PORTAL GATEWAY — Unified Nginx Ingress
  # Routes: /soc-admin/ → frontend, /soc-api/ → Flask API
  # Replaces WAF proxy as primary public ingress
  # =====================================================================
  portal_gateway:
    image: nginx:alpine
    container_name: bkids_portal_gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./portal_gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bkids_network
    logging: *default-logging
    depends_on:
      frontend_ui:
        condition: service_started
      api_server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    # =====================================================================
  # 6. SNORT 3 NGIPS ENGINE — Primary Detection Engine
  # =====================================================================
  bkids_snort_engine:
    image: bk_ids-misuse_ips:latest
    container_name: bkids_snort_engine
    restart: unless-stopped
    # === NETWORK: Capture L2 traffic directly ===
    network_mode: host
    userns_mode: host
    privileged: false
    # === CAPABILITIES: Layer 2 packet capture ===
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_NICE
      - SYS_RESOURCE
    security_opt:
      - no-new-privileges:true
    # === VOLUMES: Host → Container mapping ===
    volumes:
      # Alert log: write inside container → read on host
      - snort_logs:/var/log/snort
      # Snort config
      - ./snort.lua:/etc/snort/snort.lua:ro
      - ./core_engine/local.rules:/etc/snort/rules/local.rules:ro
      # AppID & reputation
      - ./snort_config/reputation:/etc/snort/reputation:ro
      - ./snort_config/appid:/etc/snort/appid:ro
    environment:
      SNIFF_INTERFACE: ${SNIFF_INTERFACE:-ens33}
      HOME_NET: ${HOME_NET:-192.168.13.0/24}
      SNORT_THREADS: ${SNORT_THREADS:-2}
      SNORT_LOG_DIR: /var/log/snort
    command: >
      /bin/bash -c "
        export LD_LIBRARY_PATH=/home/snorty/snort3/lib:/usr/local/lib;
        echo '[SNORT] Starting Snort 3 on interface: ${SNIFF_INTERFACE:-ens33}';
        mkdir -p /var/log/snort;
        chmod 777 /var/log/snort;
        /home/snorty/snort3/bin/snort -c /etc/snort/snort.lua -R /etc/snort/rules/local.rules --daq afpacket -i ${SNIFF_INTERFACE:-ens33} --daq-batch-size 64 -z ${SNORT_THREADS:-2} -k none -l /var/log/snort -v 2>&1 | tee -a /var/log/snort/startup.log
      "
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'snort.*ens33' > /dev/null && test -f /var/log/snort/alert_json.txt || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  # =====================================================================
  # 7. ANOMALY SENSOR — Behavioral Analysis Engine
  # Implements CUSUM multithreaded detection, bypasses GIL, and 
  # synchronizes blocks through the central SOAR engine
  # =====================================================================
  anomaly_sensor:
    build:
      context: .
      dockerfile: Dockerfile.sensor
      network: host
    container_name: bkids_anomaly_sensor
    restart: unless-stopped
    env_file: .env
    network_mode: "host"
    pid: "host"
    userns_mode: host
    extra_hosts:
      - "mysql_db:127.0.0.1"
      - "kafka:127.0.0.1"
      - "redis_cache:127.0.0.1"
    volumes:
      - ./:/app
      - ./storage:/app/storage
    working_dir: /app/core_engine
    command: python3 sensor_ids.py
    logging: *default-logging
    depends_on:
      mysql_db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - CHOWN
      - SETGID
      - SETUID

# =========================================================================
networks:
  bkids_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  mysql_data:
  # Shared snort alert log volume between bkids_snort_engine and api_server
  snort_logs:
