# /home/ids/bk_ids/portal_gateway/nginx.conf
# ========================================================================
# BK-IDS SOC: PORTAL GATEWAY — Enterprise Reverse Proxy
# Purpose: Unified entry point for SOC Dashboard + API
# Port: 9000 (External)
#
# Routes:
#   /soc-admin/*    → Vue.js Dashboard (bkids_frontend:80)
#   /soc-api/*      → Flask API (bkids_api:5000)
# ========================================================================

# Upstream definitions for clarity
upstream soc_frontend {
    server bkids_frontend:80;
}

upstream soc_api {
    server bkids_api:5000;
}

server {
    listen 9000;
    server_name 192.168.13.129 localhost;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Global proxy buffer settings
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Global security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request size limit
    client_max_body_size 50m;

    # ========================================
    # Route 1: /soc-admin/* → Vue.js SOC Dashboard
    # Internal: bkids_frontend:80
    # ========================================
    location /soc-admin/ {
        rewrite ^/soc-admin(/.*)$ $1 break;
        proxy_pass http://bkids_frontend:80;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Remove X-Frame-Options from upstream, set our own
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Allow iFrame embedding from Portal (Django/Flask parent)
        add_header X-Frame-Options "ALLOW-FROM http://192.168.13.129:9000" always;
        add_header Content-Security-Policy "frame-ancestors 'self' http://192.168.13.129:9000 http://192.168.13.129:8000" always;



        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Disable buffering for real-time updates
        proxy_buffering off;
    }

    # ========================================
    # Route 2a: /soc-api/routes/api.php → Flask /backend_api/routes/api.php
    # ========================================
    location ~ ^/soc-api/routes/api\.php$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://192.168.13.129:9000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-CSRFToken' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://bkids_api:5000/backend_api/routes/api.php$is_args$args;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-CSRFToken $http_x_csrftoken;

        # CORS headers for actual requests — specific origin only
        add_header 'Access-Control-Allow-Origin' 'http://192.168.13.129:9000' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization, X-Request-Id' always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # ========================================
    # Route 2b: /soc-api/* → Flask API Backend (/api/*)
    # ========================================
    location /soc-api/ {
        # CORS preflight handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://192.168.13.129:9000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-CSRFToken' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/soc-api(/.*)$ /api$1 break;
        proxy_pass http://bkids_api:5000;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Forward JWT Authorization header (critical for SSO)
        proxy_set_header Authorization $http_authorization;

        # Forward CSRF token if present
        proxy_set_header X-CSRFToken $http_x_csrftoken;

        # CORS headers for actual requests — specific origin only
        add_header 'Access-Control-Allow-Origin' 'http://192.168.13.129:9000' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization, X-Request-Id' always;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # Disable buffering for API responses
        proxy_buffering off;
    }

    # ========================================
    # Health Check Endpoint
    # ========================================
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"portal-gateway","version":"1.0.0"}';
        add_header Content-Type application/json;
    }

    # ========================================
    # Default: redirect to /soc-admin/
    # ========================================
    location = / {
        return 302 /soc-admin/;
    }

    # ========================================
    # Error Pages
    # ========================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
