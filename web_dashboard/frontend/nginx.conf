# ==========================================
# BK-IDS SOC — Frontend Nginx Config v3.0
# Zero Trust CORS — specific origins only
# ==========================================

map $http_origin $cors_origin {
    default "";
    "http://192.168.13.129:8080"    $http_origin;
    "http://192.168.13.129:9000"    $http_origin;
    "http://192.168.13.129:80"      $http_origin;
    "http://localhost:8080"          $http_origin;
    "http://localhost:9000"          $http_origin;
    "http://localhost:80"            $http_origin;
}

server {
    listen       80 default_server;
    listen  [::]:80;
    server_name  localhost _;

    resolver 127.0.0.11 valid=10s;

    # Global — no cache for HTML pages
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;

    # ==========================================
    # API PROXY — /api/* → Flask /*
    # ==========================================
    location ~ ^/api(/.*)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        set $backend http://bkids_api:5000;
        proxy_pass $backend/api$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ==========================================
    # LEGACY PHP-ROUTE PROXY — /soc-api/routes/api.php → /backend_api/routes/api.php
    # MUST come before the generic /soc-api/* block below
    # ==========================================
    location ~ ^/soc-api/routes/api\.php$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        set $backend http://bkids_api:5000;
        proxy_pass $backend/backend_api/routes/api.php$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ==========================================
    # SOC API PROXY — /soc-api/* → Flask /*
    # ==========================================
    location ~ ^/soc-api(/.*)$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        set $backend http://bkids_api:5000;
        proxy_pass $backend/api$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ==========================================
    # LOGIN PAGE — Public
    # ==========================================
    location = /login {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /login.html =404;
    }

    location = /login.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /login.html =404;
    }

    # ==========================================
    # PACKET DETAIL PAGE — Public (auth by JS)
    # ==========================================
    location = /packet-detail {
        root   /usr/share/nginx/html;
        try_files /packet-detail.html =404;
    }

    location = /packet-detail.html {
        root   /usr/share/nginx/html;
        try_files /packet-detail.html =404;
    }

    # ==========================================
    # REGISTER PAGE — Public
    # ==========================================
    location = /register {
        root   /usr/share/nginx/html;
        try_files /login.html =404;
    }

    # ==========================================
    # STATIC FILES — Vue.js SPA (catch-all)
    # ==========================================
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
